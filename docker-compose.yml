services:
  bot:
    build: .
    env_file: .env
    environment:
      MODE: bot
    volumes:
      - death-data:/app/data
      - death-clips:/app/clips
      - ./game_profiles/templates:/app/game_profiles/templates
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      MODE: web
      WEB_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - death-data:/app/data
      - death-clips:/app/clips
      - ./game_profiles/templates:/app/game_profiles/templates
    restart: unless-stopped

volumes:
  death-data:
  death-clips:
